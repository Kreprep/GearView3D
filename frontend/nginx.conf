server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The .glb models are the bulk of the payload and gzip barely helps, so only
  # the text assets are compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Course geometry payloads are large; keep a little headroom over the 2mb
  # express.json limit in backend/src/app.js.
  client_max_body_size 4m;

  location ^~ /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change under the same name. `^~` so the static
  # regex block below cannot steal them and downgrade them to a 1h cache.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Unhashed static files - public/images, public/models. Two jobs here.
  #
  # `=404` is the important one: without it these fall through to the SPA
  # rule below and a MISSING file answers 200 text/html with the app shell.
  # Browsers happily cache that under the image URL, so adding the real file
  # later fixes nothing for anyone who visited first - which is exactly what
  # happened to the module 3/4 card artwork.
  #
  # The explicit max-age replaces heuristic freshness (10% of the response's
  # age, unbounded), so swapped artwork turns over in an hour, not in days.
  location ~* \.(png|jpe?g|gif|svg|webp|ico|glb|gltf|bin|woff2?|mp4)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # The app uses history pushState routing (frontend/src/lib/router.js) with no
  # server-side routes, so every unknown path has to return index.html or a
  # refresh on /admin/courses would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell names the hashed asset bundle, so a cached copy pins a visitor
  # to an old build. It must be revalidated every load; `no-cache` still
  # allows a 304, so this costs one conditional request, not a re-download.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
