server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The .glb models are the bulk of the payload and gzip barely helps, so only
  # the text assets are compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Course geometry payloads are large; keep a little headroom over the 2mb
  # express.json limit in backend/src/app.js.
  client_max_body_size 4m;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The app uses history pushState routing (frontend/src/lib/router.js) with no
  # server-side routes, so every unknown path has to return index.html or a
  # refresh on /admin/courses would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
